name: Deploy API Documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy job
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare public directory
        run: |
          # Ensure public directory exists
          mkdir -p public

          # Find all openapi.json files under packages/ and pick the first one
          OPENAPI_FILE=$(find packages -type f -iname 'openapi.json' 2>/dev/null | head -n 1)

          if [ -z "$OPENAPI_FILE" ]; then
            echo "Error: No openapi.json file found in the repository."
            exit 1
          fi

          echo "Using OpenAPI spec: $OPENAPI_FILE"
          cp "$OPENAPI_FILE" public/openapi.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
